
<!DOCTYPE html>
<html>
<head>
    <title>Cadence Arduino Test</title>
</head>

<body>

<h2>Cadence Arduino LED Test</h2>

<button onclick="connectArduino()">
    Connect Arduino
</button>

<button onclick="playSong()">
    Play
</button>

<button onclick="stopSong()">
    Stop
</button>

<script>

let port;
let writer;

// Connect Arduino
async function connectArduino() {
  try {
    port = await navigator.serial.requestPort();

    await port.open({ baudRate: 9600 });

    writer = port.writable.getWriter();

    // Initial LED OFF
    await sendCommand("O");

    console.log("Arduino connected!");

  } catch (error) {
    console.error("Arduino connection failed:", error);
  }
}

// Send command to Arduino
async function sendCommand(command) {
  if (!writer) {
    console.log("Arduino is not connected.");
    return;
  }

  const data = new TextEncoder().encode(command);

  await writer.write(data);
}

// Play: Blink twice per second
async function playSong() {
  await sendCommand("P");
}

// Stop: LED continuously ON
async function stopSong() {
  await sendCommand("S");
}

function stopSong() {
    sendCommand("S");
}

</script>

</body>
</html>
